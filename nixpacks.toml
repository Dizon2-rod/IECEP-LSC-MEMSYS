[phases.setup]
nixPkgs = [
    "php82",
    "php82Packages.composer",
    "php82Extensions.pdo_mysql",
    "php82Extensions.gd",
    "php82Extensions.mbstring",
    "php82Extensions.zip",
    "php82Extensions.curl",
    "php82Extensions.openssl"
]

[phases.install]
cmds = [
    "COMPOSER_ALLOW_SUPERUSER=1 composer install --no-dev --optimize-autoloader --no-interaction --no-scripts --ignore-platform-reqs --no-audit || true"
]

[start]
cmd = "php -S 0.0.0.0:$PORT -t /app"
