[PHP]
; Required PHP extensions are installed and enabled at the runtime level
; (Docker image, PHP buildpack, or system PHP). Do NOT hardcode extension=
; directives here — they cause startup warnings when an extension is
; compiled statically or the shared library is not found.

; Allow HTTP file uploads
file_uploads=On
upload_max_filesize=20M
post_max_size=20M

; Memory limit
memory_limit=256M

; Error reporting
display_errors=Off
error_reporting=E_ALL & ~E_DEPRECATED & ~E_STRICT

; Timezone
date.timezone=Asia/Manila
