worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 65;

    server {
        listen 8080;
        server_name _;
        root /app/public;
        index index.php index.html index.htm;

        client_max_body_size 20M;

        # Rewrite legacy /IECEP-LSC-MEMSYS/ or /public/ prefixes if requested on root domain
        location ^~ /IECEP-LSC-MEMSYS/public/ {
            rewrite ^/IECEP-LSC-MEMSYS/public/(.*)$ /$1 last;
        }

        location ^~ /IECEP-LSC-MEMSYS/ {
            rewrite ^/IECEP-LSC-MEMSYS/(.*)$ /$1 last;
        }

        location ^~ /public/ {
            rewrite ^/public/(.*)$ /$1 last;
        }

        # Service Worker with required allowed header and no-cache
        location ~* sw\.js$ {
            add_header Service-Worker-Allowed "/" always;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Access-Control-Allow-Origin "*" always;
            try_files $uri /sw.js =404;
        }

        # Web App Manifest
        location ~* manifest\.json$ {
            add_header Content-Type "application/manifest+json" always;
            add_header Access-Control-Allow-Origin "*" always;
            try_files $uri /manifest.json =404;
        }

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location ~ \.php$ {
            try_files $uri =404;
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            include fastcgi_params;
            fastcgi_param HTTP_PROXY "";
            fastcgi_read_timeout 300;
            fastcgi_send_timeout 300;
            fastcgi_connect_timeout 300;
        }

        location ~ /\.ht {
            deny all;
        }

        location ~ /\.(env|git) {
            deny all;
        }

        location /storage/ {
            alias /app/public/storage/;
        }
    }
}